<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consultoría IA | Carbonell Soluciones</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffcc00",
                        "background-light": "#f8f8f5",
                        "background-dark": "#121212",
                        "neutral-dark": "#1a1a1a"
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                },
            },
        }
    </script>
  <style>
        body { font-family: 'Manrope', sans-serif; scroll-behavior: smooth; }
        .bg-grid-pattern { background-image: radial-gradient(circle, #ffcc0022 1px, transparent 1px); background-size: 30px 30px; }
        .chat-markdown h1, .chat-markdown h2 { font-size: 1rem; font-weight: 700; margin-top: 0.75rem; }
        .chat-markdown p { margin-bottom: 0.5rem; }
        .chat-markdown ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-neutral-dark dark:text-white transition-colors duration-300">

  <header class="sticky top-0 z-50 w-full bg-background-dark border-b border-white/10 px-6 lg:px-20 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <img src="assets/icon-carbonell-soluciones.png" alt="Carbonell Soluciones" class="size-8 object-contain rounded"/>
      <h1 class="text-white text-xl font-extrabold tracking-tighter uppercase">Carbonell<span class="text-primary">Soluciones</span></h1>
    </a>
    <nav class="hidden md:flex items-center gap-8">
      <a class="text-white/80 hover:text-primary text-sm font-semibold transition-colors" href="servicios.html">SERVICIOS</a>
      <a class="text-white/80 hover:text-primary text-sm font-semibold transition-colors" href="labor.html">LABOR</a>
      <a class="text-white/80 hover:text-primary text-sm font-semibold transition-colors" href="proyectos.html">PROYECTOS</a>
      <a class="px-5 py-2 bg-primary text-black text-sm font-bold rounded-lg hover:bg-white transition-all" href="consultoria-ia.html">CONSULTORÍA IA</a>
    </nav>
  </header>

  <main class="flex flex-col min-h-[calc(100vh-5rem)]">
    <section class="relative flex-1 flex flex-col bg-white min-h-0 pt-4 sm:pt-6">
      <div class="absolute inset-0 bg-grid-pattern opacity-10"></div>
      <div class="w-full flex-1 flex flex-col px-4 sm:px-6 lg:px-8 relative z-10 min-h-0">
        <div id="chat-consultoria-ia" class="flex flex-col flex-1 min-h-[calc(100vh-6rem)] rounded-2xl overflow-hidden border-2 border-primary/20 shadow-xl bg-white">
          
          <div class="bg-primary px-6 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-black">smart_toy</span>
              <span class="text-black font-bold text-sm tracking-tight uppercase">Agente Estratégico IA</span>
            </div>
          </div>

          <div class="flex-1 min-h-0 p-6 flex flex-col gap-4 overflow-y-auto bg-white" id="chat-messages">
            <div class="bg-neutral-100 p-4 rounded-xl rounded-tl-none max-w-[85%] text-neutral-800 text-sm border border-neutral-200">
              Bienvenido a Carbonell Soluciones. Soy su asistente técnico. ¿En qué etapa se encuentra su proyecto?
            </div>
          </div>

          <div class="p-4 border-t border-neutral-100 bg-neutral-50 shrink-0">
            <div class="flex gap-2">
              <input id="chat-input" class="flex-1 bg-white border border-neutral-200 rounded-lg px-4 py-2 text-neutral-800 text-sm outline-none focus:ring-1 focus:ring-primary" placeholder="Escribe tu idea aquí..." type="text"/>
              <button id="chat-send" class="size-10 bg-primary rounded-lg flex items-center justify-center text-black hover:scale-105 transition-transform" type="button">
                <span class="material-symbols-outlined">send</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      const WEBHOOK_URL = 'https://api.carbonellsoluciones.com/webhook/carbonellsoluciones/chatIA';
      
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      const messagesEl = document.getElementById('chat-messages');

      function addBubble(text, isUser) {
        const bubble = document.createElement('div');
        bubble.className = isUser 
          ? 'bg-primary/20 p-4 rounded-xl rounded-tr-none max-w-[85%] ml-auto text-neutral-900 text-sm font-medium border border-primary/30'
          : 'bg-neutral-100 p-4 rounded-xl rounded-tl-none max-w-[95%] text-neutral-800 text-sm leading-relaxed border border-neutral-200 chat-markdown';
        
        if (isUser) {
          bubble.textContent = text;
        } else {
          bubble.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text;
        }
        
        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addBubble(text, true);
        input.value = '';
        sendBtn.disabled = true;

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ project: text })
          });

          const data = await response.json();
          const result = Array.isArray(data) ? data[0] : data;
          const output = result.output || result.response || result.text || "Mensaje enviado con éxito.";
          
          addBubble(output, false);
        } catch (err) {
          console.error('Error:', err);
          addBubble('Error de conexión con el agente. Intenta refrescar la página (Ctrl+F5) o verifica el modo SSL en Cloudflare.', false);
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    })();
  </script>
</body>
</html>
